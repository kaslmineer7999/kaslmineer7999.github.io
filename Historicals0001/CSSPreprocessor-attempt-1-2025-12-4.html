<!doctype html>
<html>
	<head>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
		<title>CSS «PreProccesor» implemented in the browser</title>
		<style type="text/css">
			*,*:after, *:before{ box-sizing: border-box; }
			html{
				display: table;
				width: 100%;
				height: 100%;
			}
			body{
				background: #222;
				color: #e9e9e9;
				text-align: center;
				margin: auto;
				padding: 21px 13px;
				max-width: 850px;
				font: 13px/1 Verdana, sans-serif;
				display: table-cell;
				vertical-align: middle;
			}
			q{
				quotes: "«" "»"; /* french quotes cuz why not */
			}
			form{
				margin: 20px 24px;
			}
			form textarea{
				width: 100%;
				height: 9999px;
				max-width: 100ch;
				max-height: 50ch;
				background: #222;
				color: #0f0;
				filter: contrast(1.2);
				resize: none;
				border-radius: 3px 12px;
				display: block;
				margin: 0px auto 24px;
				border: 1px solid gray;
			}
			form textarea::placeholder{
				color: gray;
				opacity: 1;
			}
			form textarea::-webkit-input-placeholder{
				color: gray;
				opacity: 1;
			}
			form textarea::-moz-placeholder{
				color: gray;
				opacity: 1;
			}
			form textarea:-ms-input-placeholder{
				color: gray;
				opacity: 1;
			}
			form textarea:-moz-placeholder{
				color: gray;
				opacity: 1;
			}
			form textarea:focus{
				outline: 0;
				border: 1px solid lightgray;
			}
			form label{
				display: block;
				font-size: 16px;
				margin-bottom: 24px;
				cursor: text;
			}
			form input[type=submit]{
				all: unset;
				background: transparent;
				border: 1px solid gray;
				padding: 12px;
				font-size: 16px;
				border-radius: 12px;
				cursor: pointer;
				color: #0f0;
				box-shadow: 0px 0px 12px -2px black;
				transition: 300ms;
				transition-property: box-shadow, text-shadow;
				transition-timing-function: ease-in-out;
				text-shadow: 0px 0px 12px,
							 0px 0px 3px,
							 0px 0px 6px;
			}
			form input[type=submit]:hover,
			form input[type=submit]:focus{
				box-shadow: 0px 0px 12px 3px black;
				text-shadow: 0px 0px 15px,
							 0px 0px 6px,
							 0px 0px 9px;
			}
			h1{
				font-size: 26px;
				margin-top: 8px;
			}
			form textarea[aria-hidden=true]{
				margin-top: calc(-50ch - 24px);
				box-shadow: none;
				pointer-events: none;
				filter: contrast(1.2) blur(8px) brightness(10) opacity(0.5);
				background: rgba(0, 0, 0, 0.3);
				overflow: hidden;
			}
			form div{
				overflow: hidden;
				position: relative;
				border-radius: 3px 12px;
			}
			form div:after{
				content: ' ';
				position: absolute;
				top: 0px;
				left: -24px;
				display: block;
				width: calc(100% + 6px);
				height: calc(100% - 18px);
				border-radius: inherit;
				/*box-shadow: 0px 0px 12px 6px black;*/
				background: black;
				z-index: -1;
				filter: blur(6px);
			}
		</style>
	</head>
	<body>
		<h1>CSS <q>PreProccesor</q> implemented in the browser</h1>
		<div style="margin: 20px 0px 0px"></div>
		<hr color="#404040" style="
		margin-left: -13px; margin-right: -13px; border-style: inset;
		height: 2px; border-width: 2px;"/>
		<form action="" id="form">
			<label for="input">input:</label>
			<div><textarea
			placeholder="$maxwidth: 840px&#10;&#10;body{&#10;&#9;max-width: $maxwidth;&#10}"
			rows="1" cols="1" name="input" id="input"></textarea>
			<textarea
			placeholder="$maxwidth: 840px&#10;&#10;body{&#10;&#9;max-width: $maxwidth;&#10}"
			rows="1" cols="1"
			inert="inert" aria-hidden="true" name="inputvisi"></textarea></div>
			<label for="input">output:</label>
			<div><textarea placeholder="body{&#10;&#9;max-width: 840px;&#10}"
			rows="1" cols="1" name="output" readonly="readonly"
			id="output"></textarea>
			<textarea placeholder="body{&#10;&#9;max-width: 840px;&#10}"
			rows="1" cols="1" readonly="readonly"
			aria-hidden="true" inert="inert" name="outputvisi"></textarea></div>
			<input type="submit" value="Submit	»»"/>
		</form>
		<script type="text/javascript">

		</script>
	</body>
</html>
