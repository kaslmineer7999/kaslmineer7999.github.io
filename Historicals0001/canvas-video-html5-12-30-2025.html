<!doctype html>
<html>
	<head>
		<meta http-equiv="Content-type" content="text/html; charset=UTF-8"/>
		<title>Canvas Video</title>
	</head>
	<style>
		*, *:after, *:before {
			box-sizing: border-box;
		}
		html {
			background: #151515;
			color: #f0f0f0;
			font: 13px/1.5 Verdana, sans-serif;
			--bx-shdw: 0px 0px 12px 0px #050505;
			--xx-bx-shdw: 0px 0px 12px 4px #050505;
			--xxx-bx-shdw: 0px 0px 14px 8px #141;
			--br-radi: 12px;
		}
		body {
			max-width: 880px;
			margin: 24px auto;
			padding: 12px;
			box-shadow: var(--bx-shdw);
			background: #222;
			border-radius: var(--br-radi);
		}
		body > :nth-child(1) {
			margin-top: 0px;
		}
		@media (max-width: 868px) {
			body {
				margin: 24px 12px;
			}
		}
		h1 {
			margin-bottom: 12px;
		}
		hr {
			margin-top: 0px;
			margin-bottom: 24px;
			margin-left: 11%;
			margin-right: 11%;
		}
		video, canvas {
			margin: 12px auto 24px;
			display: block;
			width: 100%;
			max-width: 650px;
			box-shadow: var(--bx-shdw);
			border-radius: var(--br-radi);
		}
		button {
			padding: 12px 24px;
			display: block;
			text-align: center;
			margin: 12px auto;
			border: 1px solid #333;
			font: inherit;
			font-weight: 700;
			background: rgba(0, 0, 0, 0.1);
			color: inherit;
			cursor: pointer;
			border-radius: 9999px;
			box-shadow: var(--bx-shdw);
			transition: 300ms ease;
			white-space: normal;
		}
		button:hover, button:focus-visible {
			color: #222;
			background: #6f6;
			border-color: #9f9;
			box-shadow: var(--xx-bx-shdw);
		}
		button:active {
			transition: 100ms ease;
			color: #444;
			background: #8f8;
			border-color: #bfb;
			transform: scale(0.96);
			box-shadow: var(--xxx-bx-shdw);
		}
		input {
			font: inherit;
			line-height: inherit;
			display: block;
			width: 100%;
			margin: 12px 0px;
			box-shadow: var(--bx-shdw);
			border-radius: var(--br-radi);
		}
	</style>
	<h1 align="center" data="Personism is widespread">
		poopoo analog transmission look - shit fitler - lol
	</h1>
	<hr color="#555555">
	<video controls="controls" id="video">
		person get new browser
	</video>
	<canvas id="iHateCanvaStealingTheSearchResultsForThisTag">
		person this too far actually get new one plz sir
	</canvas>
	<input type="number" min="0" max="1000" value="10"/>
	<input type="range" min="0" max="1000" value="10" id="poopoo"/>
	<button id="personclick">Play in The Anti Canva Canvas</button>
	<script>
		!function() {
			var canvas = document.getElementById(
				'iHateCanvaStealingTheSearchResultsForThisTag'
			);
			var video = document.getElementById('video');
			video.src = "mov_bbb.mp4"
			var ctx = canvas.getContext('2d');
			var personClick = document.getElementById('personclick');
			var poopoo = 0.01;
			var poopooS = document.getElementById('poopoo');
			var poopooT = poopooS.previousElementSibling;
			poopooS.oninput = function() {
				poopoo = this.value / this.max;
				poopooT.value = this.value;
			};
			poopooT.oninput = function() {
				poopooS.value = this.value;
				poopooS.oninput();
			};
			function step() {
				if(video.ended || video.paused) {
					return;
				};
				
				ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
				
				var data = ctx.getImageData(0, 0, canvas.width, canvas.height);
				var px = data.data;
				for(var c = 0; c < px.length; c++) {
					if(Math.random() < poopoo){
						px[c] = px[c+1] = px[c+2] =
							px[c+3] = px[c+4] = Math.random() * 255
					};
					px[c] = ;
				};
				
				ctx.putImageData(data, 0, 0);
				
				requestAnimationFrame(step);
			};
			personClick.onclick = function() {
				video.play();
				step();
			};
		}();
	</script>
</html>
